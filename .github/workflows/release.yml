name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.8)'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            short: windows
          - os: macos-latest
            short: macos
          - os: ubuntu-latest
            short: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Verify tag matches packageVersion
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF##*/}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(grep -E 'app\.version\s*=' gradle.properties | head -1 | sed -E 's/.*=\s*//')
          echo "Tag version: $TAG_VERSION"
          echo "packageVersion: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match app.version $PKG_VERSION"
            exit 1
          fi

      - name: Build native installer + portable ZIP
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS :composeApp:createPortableZip --stacktrace

      - name: Build branded Windows setup (Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        run: ./gradlew :composeApp:packageWindowsSetup --stacktrace

      - name: Generate SHA-256 checksums
        shell: bash
        run: ./gradlew :composeApp:generateReleaseChecksums

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p staged
          find composeApp/build/compose/binaries/main-release composeApp/build/installer composeApp/build/distributions \
            -type f -not -path '*/main-release/app/*' \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*-portable.zip' -o -name 'SHA256SUMS.txt' \) \
            -exec cp -v {} staged/ \; 2>/dev/null || true
          ls -la staged

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chatone-${{ matrix.short }}
          path: staged/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*-portable.zip' \) \
            -exec cp -v {} release-assets/ \;
          find artifacts -type f -name 'SHA256SUMS.txt' -print0 |
            xargs -0 cat > release-assets/SHA256SUMS.txt || true
          ls -la release-assets

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        id: notes
        run: |
          {
            echo 'body<<CHATONE_EOF'
            echo '## Installation'
            echo ''
            echo '| Platform | File |'
            echo '|---|---|'
            echo '| Windows (recommended) | `Chatone-*-setup.exe` |'
            echo '| Windows (MSI) | `Chatone-*.msi` |'
            echo '| macOS | `Chatone-*.dmg` |'
            echo '| Linux | `chatone_*.deb` |'
            echo '| Портативная версия | `Chatone-*-portable.zip` |'
            echo ''
            echo 'Контрольные суммы — в `SHA256SUMS.txt`. Приложение обновляется само и проверяет их при загрузке.'
            echo ''
            echo '> Архивы `Source code (zip/tar.gz)` ниже добавляются GitHub автоматически и не являются установщиками.'
            echo 'CHATONE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Chatone ${{ steps.tag.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
