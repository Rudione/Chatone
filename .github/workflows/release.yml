name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.8)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.name }}

    steps:
      - name: Resolve and validate tag
        id: tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Refusing to build an unexpected tag name"; exit 1 ;;
          esac

          if [ "${#TAG}" -gt 40 ] || [ "$TAG" != "${TAG//[^A-Za-z0-9._-]/}" ]; then
            echo "::error::Tag name contains characters that are not allowed"
            exit 1
          fi

          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          persist-credentials: false

      - name: Verify tag matches packageVersion
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail

          TAG_VERSION="${RELEASE_TAG#v}"
          PKG_VERSION=$(grep -E 'app\.version\s*=' gradle.properties | head -1 | sed -E 's/.*=\s*//')

          echo "Tag version: $TAG_VERSION"
          echo "packageVersion: $PKG_VERSION"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match app.version $PKG_VERSION"
            exit 1
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            short: windows
          - os: macos-latest
            short: macos
          - os: ubuntu-latest
            short: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build native installer + portable ZIP
        shell: bash
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS :composeApp:createPortableZip --stacktrace

      - name: Build branded Windows setup (Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        run: ./gradlew :composeApp:packageWindowsSetup --stacktrace

      - name: Generate SHA-256 checksums
        shell: bash
        run: ./gradlew :composeApp:generateReleaseChecksums

      - name: Sign release artifacts
        shell: bash
        env:
          CHATONE_UPDATE_SIGNING_KEY: ${{ secrets.CHATONE_UPDATE_SIGNING_KEY }}
        run: ./gradlew :composeApp:signReleaseArtifacts

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p staged

          for dir in \
            composeApp/build/compose/binaries/main-release \
            composeApp/build/installer \
            composeApp/build/distributions; do
            if [ -d "$dir" ]; then
              find "$dir" \
                -type f \
                -not -path '*/main-release/app/*' \
                \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*-portable.zip' -o -name '*.sig' -o -name 'SHA256SUMS.txt' \) \
                -exec cp -v {} staged/ \;
            fi
          done

          ls -la staged

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Chatone-${{ matrix.short }}
          path: staged/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts

      - name: Flatten artifact tree
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          duplicates=$(find artifacts -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*-portable.zip' -o -name '*.sig' \) \
            -printf '%f\n' | sort | uniq -d)

          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate asset names across platforms; they would overwrite each other:"
            echo "$duplicates"
            exit 1
          fi

          find artifacts -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*-portable.zip' -o -name '*.sig' \) \
            -exec cp -v {} release-assets/ \;

          for asset in release-assets/*; do
            case "$asset" in
              *.sig) continue ;;
            esac

            if [ ! -f "$asset.sig" ]; then
              echo "::error::$(basename "$asset") has no update signature"
              exit 1
            fi
          done

          sum_files=$(find artifacts -type f -name 'SHA256SUMS.txt' -print)

          if [ -z "$sum_files" ]; then
            echo "::error::No SHA256SUMS.txt files were produced"
            exit 1
          fi

          find artifacts -type f -name 'SHA256SUMS.txt' -print0 |
            xargs -0 cat |
            grep -v '^[[:space:]]*$' |
            sort -k2 > combined-sums.txt

          if [ ! -s combined-sums.txt ]; then
            echo "::error::Combined SHA256SUMS.txt is empty"
            exit 1
          fi

          sum_duplicates=$(awk '{print $2}' combined-sums.txt | sort | uniq -d)

          if [ -n "$sum_duplicates" ]; then
            echo "::error::SHA256SUMS.txt lists the same file name more than once:"
            echo "$sum_duplicates"
            exit 1
          fi

          while read -r _ name; do
            if [ ! -f "release-assets/$name" ]; then
              echo "::error::SHA256SUMS.txt references $name, which is not published"
              exit 1
            fi
          done < combined-sums.txt

          mv combined-sums.txt release-assets/SHA256SUMS.txt

          for asset in release-assets/*; do
            case "$asset" in
              *.sig|*/SHA256SUMS.txt) continue ;;
            esac

            name=$(basename "$asset")

            count=$(awk -v target="$name" '$2 == target { count++ } END { print count + 0 }' release-assets/SHA256SUMS.txt)

            if [ "$count" -ne 1 ]; then
              echo "::error::$name must have exactly one SHA-256 checksum entry, found $count"
              exit 1
            fi
          done

          require() {
            compgen -G "release-assets/$1" >/dev/null || {
              echo "::error::Missing required asset matching $1"
              exit 1
            }
          }

          require 'Chatone-*-setup.exe'
          require 'Chatone-*.msi'
          require 'Chatone-*.dmg'
          require 'chatone_*.deb'
          require 'Chatone-*-windows-portable.zip'
          require 'Chatone-*-macos-portable.zip'
          require 'Chatone-*-linux-portable.zip'

          cd release-assets
          sha256sum --check --strict SHA256SUMS.txt
          cd ..

          cat release-assets/SHA256SUMS.txt
          ls -la release-assets

      - name: Resolve tag name
        id: tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Refusing to publish an unexpected tag name"; exit 1 ;;
          esac

          if [ "${#TAG}" -gt 40 ] || [ "$TAG" != "${TAG//[^A-Za-z0-9._-]/}" ]; then
            echo "::error::Tag name contains characters that are not allowed"
            exit 1
          fi

          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        run: |
          {
            echo 'body<<CHATONE_EOF'
            echo '## Installation'
            echo ''
            echo '| Platform | File |'
            echo '|---|---|'
            echo '| Windows (recommended) | `Chatone-*-setup.exe` |'
            echo '| Windows (MSI) | `Chatone-*.msi` |'
            echo '| macOS | `Chatone-*.dmg` |'
            echo '| Linux | `chatone_*.deb` |'
            echo '| Windows (portable) | `Chatone-*-windows-portable.zip` |'
            echo '| macOS (portable) | `Chatone-*-macos-portable.zip` |'
            echo '| Linux (portable) | `Chatone-*-linux-portable.zip` |'
            echo ''
            echo 'SHA-256 checksums are available in `SHA256SUMS.txt`. The application verifies update integrity automatically.'
            echo 'The `.sig` files are update signatures verified by the application. They do not need to be downloaded manually.'
            echo ''
            echo '> The `Source code (zip/tar.gz)` archives are generated automatically by GitHub and are not application installers.'
            echo 'CHATONE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Chatone ${{ steps.tag.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          files: release-assets/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --verify-tag